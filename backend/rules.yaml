# backend/rules.yaml
# PiQuaChu — NIST PQC Compliance Ruleset (FIPS 203 / 204 / 205 / 206)
#
# Every rule is tagged with metadata used by the compliance decision engine:
#   - nist_standard:  FIPS 203 (ML-KEM) | FIPS 204 (ML-DSA) | FIPS 205 (SLH-DSA)
#                     | FIPS 206 (FN-DSA / FALCON) | FIPS 202 (SHA-3 hashing)
#                     | Advisory (symmetric/TLS)
#   - category:       key-encapsulation | signatures | hashing | symmetric | tls
#   - pqc_compliant:  true  -> usage of a recognized PQC algorithm (PASS evidence)
#                     false -> legacy/broken crypto that requires migration (WARN/FAIL)
#                     NOTE: FIPS 206 (FN-DSA) is still in development; positive
#                     FIPS 206 rules are algorithm evidence, not a finalized pass.
#   - target_algorithm: the NIST algorithm the code should migrate to
#
# Severity semantics:
#   ERROR  -> broken today OR broken by Shor's algorithm (RSA/ECC/DSA key exchange
#             and signatures, DES/3DES/RC4). Frontend shows as CRITICAL (FAIL).
#   WARNING-> weakened or non-quantum-resistant hashing/TLS defaults. Frontend
#             shows as WARNING (WARN).

rules:
  # ===========================================================================
  # PYTHON
  # ===========================================================================

  # ---- Negative (legacy) rules ----------------------------------------------
  - id: weak-crypto-python-md5
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.new("md5")
          - pattern: hashlib.new('md5')
          - pattern: hmac.new(..., hashlib.md5)
          - pattern: hashes.MD5(...)
    message: "PQC compliance (FIPS 202): MD5 is broken for collision resistance and provides zero quantum security margin. Migrate to SHA-256 (FIPS 180-4) or SHA-3 (FIPS 202)."
    languages: [python]
    severity: WARNING
    metadata:
      nist_standard: FIPS 202
      category: hashing
      pqc_compliant: false
      target_algorithm: SHA-256 / SHA3-256

  - id: weak-crypto-python-sha1
    patterns:
      - pattern-either:
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("sha1")
          - pattern: hashlib.new('sha1')
          - pattern: hashes.SHA1(...)
    message: "PQC compliance (FIPS 202): SHA-1 is broken (SHAttered) and not quantum-resistant. Migrate to SHA-256 or SHA-3 (FIPS 202)."
    languages: [python]
    severity: WARNING
    metadata:
      nist_standard: FIPS 202
      category: hashing
      pqc_compliant: false
      target_algorithm: SHA-256 / SHA3-256

  - id: deprecated-rsa-python-cryptography
    patterns:
      - pattern-either:
          - pattern: rsa.generate_private_key(...)
          - pattern: RSAPrivateKey(...)
          - pattern: rsa.RSAPrivateKey(...)
    message: "PQC compliance (FIPS 203): RSA key generation will be broken by Shor's algorithm. Migrate to ML-KEM (Kyber) for key encapsulation."
    languages: [python]
    severity: ERROR
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: false
      target_algorithm: ML-KEM

  - id: deprecated-ecdh-python-cryptography
    patterns:
      - pattern-either:
          - pattern: ec.generate_private_key(...)
          - pattern: ec.ECDH(...)
          - pattern: x25519.X25519PrivateKey(...)
          - pattern: X25519PrivateKey.generate(...)
          - pattern: x25519.X25519PrivateKey.generate(...)
          - pattern: X25519PrivateKey.exchange(...)
    message: "PQC compliance (FIPS 203): ECDH / X25519 key agreement is broken by Shor's algorithm. Migrate to ML-KEM (Kyber), optionally as a hybrid X25519+ML-KEM768 scheme."
    languages: [python]
    severity: ERROR
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: false
      target_algorithm: ML-KEM (hybrid X25519MLKEM768)

  - id: deprecated-ecdsa-python-cryptography
    patterns:
      - pattern-either:
          - pattern: ec.ECDSA(...)
          - pattern: ed25519.Ed25519PrivateKey(...)
          - pattern: ed448.Ed448PrivateKey(...)
    message: "PQC compliance (FIPS 204): ECDSA/EdDSA signatures are broken by Shor's algorithm. Migrate to ML-DSA (Dilithium) or SLH-DSA (SPHINCS+) for digital signatures."
    languages: [python]
    severity: ERROR
    metadata:
      nist_standard: FIPS 204
      category: signatures
      pqc_compliant: false
      target_algorithm: ML-DSA / SLH-DSA

  - id: deprecated-des-python
    patterns:
      - pattern-either:
          - pattern: Crypto.Cipher.DES.new(...)
          - pattern: Crypto.Cipher.DES3.new(...)
          - pattern: des.new(...)
          - pattern: des3.new(...)
    message: "PQC compliance (Advisory): DES/3DES is broken (64-bit block, brute-force feasible) and provides no quantum security margin. Migrate to AES-256-GCM."
    languages: [python]
    severity: ERROR
    metadata:
      nist_standard: Advisory
      category: symmetric
      pqc_compliant: false
      target_algorithm: AES-256-GCM

  - id: deprecated-rc4-python
    patterns:
      - pattern-either:
          - pattern: Crypto.Cipher.ARC4.new(...)
          - pattern: ARC4.new(...)
    message: "PQC compliance (Advisory): RC4 is cryptographically broken. Migrate to AES-256-GCM (quantum-resistant symmetric encryption)."
    languages: [python]
    severity: ERROR
    metadata:
      nist_standard: Advisory
      category: symmetric
      pqc_compliant: false
      target_algorithm: AES-256-GCM

  - id: deprecated-tlsv1-python
    patterns:
      - pattern-either:
          - pattern: ssl.SSLContext(ssl.PROTOCOL_TLSv1)
          - pattern: ssl.SSLContext(ssl.PROTOCOL_TLSv1_1)
          - pattern: ssl.PROTOCOL_TLSv1
    message: "PQC compliance (Advisory): TLS 1.0/1.1 is deprecated and relies on non-PQC key exchange. Upgrade to TLS 1.3 with ML-KEM or X25519MLKEM768 hybrid key exchange."
    languages: [python]
    severity: WARNING
    metadata:
      nist_standard: Advisory
      category: tls
      pqc_compliant: false
      target_algorithm: TLS 1.3 + ML-KEM

  # ---- Positive (PQC usage) rules -------------------------------------------
  - id: pqc-mlkem-python
    patterns:
      - pattern: oqs.KeyEncapsulation($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['\"]?(ML-KEM-512|ML-KEM-768|ML-KEM-1024|Kyber512|Kyber768|Kyber1024)['\"]?$
    message: "PQC compliant (FIPS 203): ML-KEM (Kyber) key encapsulation detected — NIST-approved post-quantum key exchange."
    languages: [python]
    severity: INFO
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: true
      target_algorithm: ML-KEM

  - id: pqc-mldsa-python
    patterns:
      - pattern: oqs.Signature($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['\"]?(ML-DSA-44|ML-DSA-65|ML-DSA-87|Dilithium2|Dilithium3|Dilithium5)['\"]?$
    message: "PQC compliant (FIPS 204): ML-DSA (Dilithium) digital signature scheme detected — NIST-approved post-quantum signatures."
    languages: [python]
    severity: INFO
    metadata:
      nist_standard: FIPS 204
      category: signatures
      pqc_compliant: true
      target_algorithm: ML-DSA

  - id: pqc-slhdsa-python
    patterns:
      - pattern: oqs.Signature($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['\"]?(SLH-DSA|Sphincs|SPHINCS).*['\"]?$
    message: "PQC compliant (FIPS 205): SLH-DSA (SPHINCS+) hash-based signature scheme detected — NIST-approved backup digital signatures."
    languages: [python]
    severity: INFO
    metadata:
      nist_standard: FIPS 205
      category: signatures
      pqc_compliant: true
      target_algorithm: SLH-DSA

  - id: pqc-mlkem-python-cryptography
    patterns:
      - pattern-either:
          - pattern: MLKEM768(...)
          - pattern: MLKEM1024(...)
          - pattern: X25519MLKEM768(...)
    message: "PQC compliant (FIPS 203): ML-KEM usage detected via the Python cryptography library (incl. X25519MLKEM768 hybrid)."
    languages: [python]
    severity: INFO
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: true
      target_algorithm: ML-KEM

  # ===========================================================================
  # JAVA & SPRING
  # ===========================================================================

  # ---- Negative (legacy) rules ----------------------------------------------
  - id: weak-crypto-java-md5
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - patterns:
              - pattern: MessageDigest.getInstance($ALG)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^['\"]?(md5|md2)['\"]?$
    message: "PQC compliance (FIPS 202): MD5 detected in Java MessageDigest. Migrate to SHA-256 or SHA3-256 (FIPS 202)."
    languages: [java]
    severity: WARNING
    metadata:
      nist_standard: FIPS 202
      category: hashing
      pqc_compliant: false
      target_algorithm: SHA-256 / SHA3-256

  - id: weak-crypto-java-sha1
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("SHA-1")
          - pattern: MessageDigest.getInstance("SHA1")
          - patterns:
              - pattern: MessageDigest.getInstance($ALG)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^['\"]?(sha-?1)['\"]?$
    message: "PQC compliance (FIPS 202): SHA-1 detected in Java MessageDigest. Migrate to SHA-256 or SHA3-256 (FIPS 202)."
    languages: [java]
    severity: WARNING
    metadata:
      nist_standard: FIPS 202
      category: hashing
      pqc_compliant: false
      target_algorithm: SHA-256 / SHA3-256

  - id: deprecated-rsa-java
    patterns:
      - pattern-either:
          - pattern: KeyPairGenerator.getInstance("RSA")
          - patterns:
              - pattern: KeyPairGenerator.getInstance($ALG)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^['\"]?(rsa)['\"]?$
    message: "PQC compliance (FIPS 203): RSA will be broken by Shor's algorithm. Migrate to ML-KEM (Kyber) for key encapsulation."
    languages: [java]
    severity: ERROR
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: false
      target_algorithm: ML-KEM

  - id: deprecated-ecdh-java
    patterns:
      - pattern-either:
          - pattern: KeyAgreement.getInstance("ECDH")
          - pattern: KeyAgreement.getInstance("DH")
          - pattern: KeyPairGenerator.getInstance("EC")
          - patterns:
              - pattern: KeyPairGenerator.getInstance($ALG)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^['\"]?(ec|ecdh|dh|diffiehellman)['\"]?$
    message: "PQC compliance (FIPS 203): ECDH/DH key agreement will be broken by Shor's algorithm. Migrate to ML-KEM (Kyber)."
    languages: [java]
    severity: ERROR
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: false
      target_algorithm: ML-KEM

  - id: deprecated-ecdsa-java
    patterns:
      - pattern-either:
          - patterns:
              - pattern: Signature.getInstance($ALG)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^['\"]?.*(ecdsa|ed25519|ed448|sha(1|256|384|512)?withrsa|md5withrsa).*['\"]?$
          - pattern: KeyPairGenerator.getInstance("DSA")
    message: "PQC compliance (FIPS 204): classical digital signatures (ECDSA/RSA/DSA) will be broken by Shor's algorithm. Migrate to ML-DSA (Dilithium) or SLH-DSA (SPHINCS+)."
    languages: [java]
    severity: ERROR
    metadata:
      nist_standard: FIPS 204
      category: signatures
      pqc_compliant: false
      target_algorithm: ML-DSA / SLH-DSA

  - id: deprecated-des-java
    patterns:
      - pattern: Cipher.getInstance($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['\"]?.*(des|3des|desede|rc4).*['\"]?$
    message: "PQC compliance (Advisory): DES/3DES/RC4 is broken. Migrate to AES-256-GCM."
    languages: [java]
    severity: ERROR
    metadata:
      nist_standard: Advisory
      category: symmetric
      pqc_compliant: false
      target_algorithm: AES-256-GCM

  - id: deprecated-tlsv1-java
    patterns:
      - pattern-either:
          - pattern: SSLContext.getInstance("TLSv1")
          - pattern: SSLContext.getInstance("TLSv1.1")
          - pattern: SSLContext.getInstance("SSLv3")
    message: "PQC compliance (Advisory): TLS 1.0/1.1/SSLv3 is deprecated. Upgrade to TLS 1.3."
    languages: [java]
    severity: WARNING
    metadata:
      nist_standard: Advisory
      category: tls
      pqc_compliant: false
      target_algorithm: TLS 1.3

  - id: spring-security-weak-password-encoder
    patterns:
      - pattern: new MessageDigestPasswordEncoder("MD5")
    message: "PQC compliance (Advisory): Spring Security using outdated MD5 encoder. Upgrade to Argon2id or BCrypt as an interim step before PQC standard adoption."
    languages: [java]
    severity: ERROR
    metadata:
      nist_standard: Advisory
      category: hashing
      pqc_compliant: false
      target_algorithm: Argon2id / BCrypt

  # ---- Positive (PQC usage) rules -------------------------------------------
  - id: pqc-mlkem-java
    patterns:
      - pattern-either:
          - pattern: new KyberKeyPairGenerator()
          - pattern: new KyberKeyPairGenerator(...)
          - pattern: KyberKeyGenerationParameters(...)
          - pattern: new KyberKeyGenerationParameters(...)
          - pattern: new MLKEMKeyPairGenerator()
          - pattern: MLKEMKeyGenerationParameters(...)
    message: "PQC compliant (FIPS 203): ML-KEM (Kyber) key encapsulation detected via Bouncy Castle PQC."
    languages: [java]
    severity: INFO
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: true
      target_algorithm: ML-KEM

  - id: pqc-mldsa-java
    patterns:
      - pattern-either:
          - pattern: new DilithiumKeyPairGenerator()
          - pattern: new DilithiumKeyPairGenerator(...)
          - pattern: DilithiumKeyGenerationParameters(...)
          - pattern: new MLDSAKeyPairGenerator()
          - pattern: MLDSAKeyGenerationParameters(...)
    message: "PQC compliant (FIPS 204): ML-DSA (Dilithium) digital signatures detected via Bouncy Castle PQC."
    languages: [java]
    severity: INFO
    metadata:
      nist_standard: FIPS 204
      category: signatures
      pqc_compliant: true
      target_algorithm: ML-DSA

  - id: pqc-slhdsa-java
    patterns:
      - pattern-either:
          - pattern: new SPHINCSPlusKeyPairGenerator()
          - pattern: new SPHINCSPlusKeyPairGenerator(...)
          - pattern: SPHINCSPlusKeyGenerationParameters(...)
          - pattern: new SLHDSAKeyPairGenerator()
          - pattern: SLHDSAKeyGenerationParameters(...)
    message: "PQC compliant (FIPS 205): SLH-DSA (SPHINCS+) hash-based signatures detected via Bouncy Castle PQC."
    languages: [java]
    severity: INFO
    metadata:
      nist_standard: FIPS 205
      category: signatures
      pqc_compliant: true
      target_algorithm: SLH-DSA

  # ===========================================================================
  # JAVASCRIPT / TYPESCRIPT (Node.js crypto + WebCrypto)
  # ===========================================================================

  # ---- Negative (legacy) rules ----------------------------------------------
  - id: nodejs-weak-crypto
    patterns:
      - pattern-either:
          - pattern: crypto.createHash('md5')
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash('sha1')
          - pattern: crypto.createHash("sha1")
    message: "PQC compliance (FIPS 202): Node.js using weak hashing (MD5/SHA-1). Upgrade to 'sha256' or 'sha3-256'."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      nist_standard: FIPS 202
      category: hashing
      pqc_compliant: false
      target_algorithm: sha256 / sha3-256

  - id: nodejs-rsa-keypair
    patterns:
      - pattern: $OBJ.generateKeyPairSync($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['\"]?(rsa)['\"]?$
    message: "PQC compliance (FIPS 203): RSA key pair generation will be broken by Shor's algorithm. Migrate to ML-KEM (Kyber) for key encapsulation."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: false
      target_algorithm: ML-KEM

  - id: nodejs-ecdsa-keypair
    patterns:
      - pattern: $OBJ.generateKeyPairSync($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['\"]?(ec|ed25519|ed448|dsa)['\"]?$
    message: "PQC compliance (FIPS 204): ECDSA/EdDSA/DSA signatures will be broken by Shor's algorithm. Migrate to ML-DSA (Dilithium) or SLH-DSA (SPHINCS+)."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      nist_standard: FIPS 204
      category: signatures
      pqc_compliant: false
      target_algorithm: ML-DSA / SLH-DSA

  - id: nodejs-des-cipher
    patterns:
      - pattern: crypto.createCipheriv($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i).*(des|3des|ede3|rc4).*
    message: "PQC compliance (Advisory): DES/3DES/RC4 is broken. Migrate to aes-256-gcm."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      nist_standard: Advisory
      category: symmetric
      pqc_compliant: false
      target_algorithm: aes-256-gcm

  - id: webcrypto-rsa-oaep
    patterns:
      - pattern: "crypto.subtle.generateKey({name: 'RSA-OAEP', ...}, ...)"
      - pattern: "crypto.subtle.generateKey({name: \"RSA-OAEP\", ...}, ...)"
    message: "PQC compliance (FIPS 203): WebCrypto RSA-OAEP key exchange will be broken by Shor's algorithm. Migrate to ML-KEM (Kyber)."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: false
      target_algorithm: ML-KEM

  - id: webcrypto-ecdsa-sign
    patterns:
      - pattern-either:
          - pattern: "crypto.subtle.generateKey({name: 'ECDSA', ...}, ...)"
          - pattern: "crypto.subtle.generateKey({name: \"ECDSA\", ...}, ...)"
          - pattern: "crypto.subtle.generateKey({name: 'RSASSA-PKCS1-v1_5', ...}, ...)"
          - pattern: "crypto.subtle.generateKey({name: \"RSASSA-PKCS1-v1_5\", ...}, ...)"
    message: "PQC compliance (FIPS 204): WebCrypto ECDSA/RSA signatures will be broken by Shor's algorithm. Migrate to ML-DSA (Dilithium) or SLH-DSA (SPHINCS+)."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      nist_standard: FIPS 204
      category: signatures
      pqc_compliant: false
      target_algorithm: ML-DSA / SLH-DSA

  # ---- Positive (PQC usage) rules -------------------------------------------
  - id: pqc-mlkem-js
    patterns:
      - pattern-either:
          - pattern: mlkem768.keygen(...)
          - pattern: mlkem768.encapsulate(...)
          - pattern: mlkem768.decapsulate(...)
          - pattern: mlkem768(...)
          - pattern: MLKEM768(...)
          - pattern: kem.encap(...)
          - pattern: new MLKEM768KeyPair()
          - pattern: from('@noble/post-quantum/ml-kem')
    message: "PQC compliant (FIPS 203): ML-KEM (Kyber) detected in JavaScript/TypeScript."
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: true
      target_algorithm: ML-KEM

  - id: pqc-mldsa-js
    patterns:
      - pattern-either:
          - pattern: mldsa65.keygen(...)
          - pattern: mldsa65.sign(...)
          - pattern: mldsa65.verify(...)
          - pattern: mldsa44.keygen(...)
          - pattern: mldsa87.keygen(...)
          - pattern: mldsa65(...)
          - pattern: MLDSA65(...)
          - pattern: dilithium(...)
          - pattern: new MLDSA65KeyPair()
          - pattern: from('@noble/post-quantum/ml-dsa')
    message: "PQC compliant (FIPS 204): ML-DSA (Dilithium) detected in JavaScript/TypeScript."
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      nist_standard: FIPS 204
      category: signatures
      pqc_compliant: true
      target_algorithm: ML-DSA

  - id: pqc-slhdsa-js
    patterns:
      - pattern-either:
          - pattern: slhdsa_sha2_128s.keygen(...)
          - pattern: slhdsa_sha2_128s.sign(...)
          - pattern: slhdsa_sha2_128s.verify(...)
          - pattern: sphincs(...)
          - pattern: slhdsa(...)
          - pattern: new SLHDSAKeyPair()
          - pattern: from('@noble/post-quantum/slh-dsa')
    message: "PQC compliant (FIPS 205): SLH-DSA (SPHINCS+) detected in JavaScript/TypeScript."
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      nist_standard: FIPS 205
      category: signatures
      pqc_compliant: true
      target_algorithm: SLH-DSA

  # ===========================================================================
  # GO
  # ===========================================================================

  # ---- Negative (legacy) rules ----------------------------------------------
  - id: deprecated-go-rsa
    patterns:
      - pattern-either:
          - pattern: rsa.GenerateKey(...)
          - pattern: rsa.SignPKCS1v15(...)
          - pattern: rsa.EncryptPKCS1v15(...)
    message: "PQC compliance (FIPS 203): RSA will be broken by Shor's algorithm. Migrate to ML-KEM (Kyber) for key encapsulation."
    languages: [go]
    severity: ERROR
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: false
      target_algorithm: ML-KEM

  - id: deprecated-go-ecdsa
    patterns:
      - pattern-either:
          - pattern: ecdsa.GenerateKey(...)
          - pattern: ecdsa.Sign(...)
          - pattern: ed25519.Sign(...)
          - pattern: ed25519.GenerateKey(...)
    message: "PQC compliance (FIPS 204): ECDSA/EdDSA signatures will be broken by Shor's algorithm. Migrate to ML-DSA (Dilithium) or SLH-DSA (SPHINCS+)."
    languages: [go]
    severity: ERROR
    metadata:
      nist_standard: FIPS 204
      category: signatures
      pqc_compliant: false
      target_algorithm: ML-DSA / SLH-DSA

  - id: deprecated-go-hash
    patterns:
      - pattern-either:
          - pattern: md5.Sum(...)
          - pattern: md5.New()
          - pattern: sha1.Sum(...)
          - pattern: sha1.New()
    message: "PQC compliance (FIPS 202): MD5/SHA-1 detected in Go. Migrate to sha256 or sha3."
    languages: [go]
    severity: WARNING
    metadata:
      nist_standard: FIPS 202
      category: hashing
      pqc_compliant: false
      target_algorithm: sha256 / sha3

  - id: deprecated-go-des
    patterns:
      - pattern-either:
          - pattern: des.NewCipher(...)
          - pattern: rc4.NewCipher(...)
    message: "PQC compliance (Advisory): DES/RC4 is broken. Migrate to AES-256-GCM."
    languages: [go]
    severity: ERROR
    metadata:
      nist_standard: Advisory
      category: symmetric
      pqc_compliant: false
      target_algorithm: AES-256-GCM

  - id: deprecated-go-tlsv1
    patterns:
      - pattern-either:
          - pattern: tls.VersionTLS10
          - pattern: tls.VersionTLS11
    message: "PQC compliance (Advisory): TLS 1.0/1.1 is deprecated. Upgrade to TLS 1.3 with ML-KEM hybrid key exchange."
    languages: [go]
    severity: WARNING
    metadata:
      nist_standard: Advisory
      category: tls
      pqc_compliant: false
      target_algorithm: TLS 1.3 + ML-KEM

  # ---- Positive (PQC usage) rules -------------------------------------------
  - id: pqc-mlkem-go
    patterns:
      - pattern-either:
          - pattern: mlkem.NewMLKEM768(...)
          - pattern: mlkem.NewMLKEM512(...)
          - pattern: mlkem.NewMLKEM1024(...)
          - pattern: circl.kem.mlkem(...)
    message: "PQC compliant (FIPS 203): ML-KEM (Kyber) detected in Go (e.g. Cloudflare circl)."
    languages: [go]
    severity: INFO
    metadata:
      nist_standard: FIPS 203
      category: key-encapsulation
      pqc_compliant: true
      target_algorithm: ML-KEM

