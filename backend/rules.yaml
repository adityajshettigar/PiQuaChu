  # ===========================================================================
  # FIPS 206 — FN-DSA (FALCON): NIST's 4th standardized PQC algorithm
  # ===========================================================================
  # Falcon was announced for standardization in March 2025 and published as
  # FIPS 206 (FN-DSA) in May 2025 — a lattice (NTRU), hash-and-sign signature
  # scheme. Positive evidence only: there is no legacy "target" algorithm here
  # because FN-DSA is itself a migration destination for ECDSA/RSA signatures
  # (which map to FIPS 204 as the primary signature standard).

  # ---- Python: liboqs + pqcrypto --------------------------------------------
  - id: pqc-fndsa-python
    patterns:
      - pattern: oqs.Signature($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['\"]?(FN-DSA-512|FN-DSA-1024|Falcon-512|Falcon-1024|Falcon512|Falcon1024)['\"]?$
    message: "PQC compliant (FIPS 206): FN-DSA (FALCON) digital signature scheme detected — NIST-approved lattice-based post-quantum signatures (FIPS 206)."
    languages: [python]
    severity: INFO
    metadata:
      nist_standard: FIPS 206
      category: signatures
      pqc_compliant: true
      target_algorithm: FN-DSA

  - id: pqc-fndsa-python-pqcrypto
    patterns:
      - pattern-either:
          - pattern: pqcrypto.sign.falcon512.$FUNC(...)
          - pattern: pqcrypto.sign.falcon1024.$FUNC(...)
    message: "PQC compliant (FIPS 206): FN-DSA (FALCON) detected via the pqcrypto package (falcon512 / falcon1024)."
    languages: [python]
    severity: INFO
    metadata:
      nist_standard: FIPS 206
      category: signatures
      pqc_compliant: true
      target_algorithm: FN-DSA

  # ---- Java: Bouncy Castle PQC (bcpqc) -------------------------------------
  - id: pqc-fndsa-java
    patterns:
      - pattern-either:
          - pattern: new Falcon512Signer()
          - pattern: new Falcon1024Signer()
          - pattern: new FalconKeyGenerationParameters(...)
          - pattern: FalconParameters.falcon512
          - pattern: FalconParameters.falcon1024
    message: "PQC compliant (FIPS 206): FN-DSA (FALCON) detected via Bouncy Castle PQC (Falcon512Signer / Falcon1024Signer)."
    languages: [java]
    severity: INFO
    metadata:
      nist_standard: FIPS 206
